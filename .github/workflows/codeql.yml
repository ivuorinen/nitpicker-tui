---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 0"
  merge_group:

permissions: {}

# A newer push to the same ref supersedes the running analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read  # analyze the workflow files themselves
      contents: read  # check out the code
      packages: read  # fetch CodeQL query packs
      security-events: write  # upload the SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "go"]
    steps:
      - name: CodeQL Analysis
        uses: ivuorinen/actions/codeql-analysis@9a311175b62e4871d83e682bf2e772d99e6d6f44  # v2026.10.23
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
