---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 0"
  merge_group:

permissions: {}

# A newer push to the same ref supersedes the running analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read  # analyze the workflow files themselves
      contents: read  # check out the code
      packages: read  # fetch CodeQL query packs
      security-events: write  # upload the SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "go"]
    steps:
      - name: CodeQL Analysis
        uses: ivuorinen/actions/codeql-analysis@a1b5eba984db86496ecd9568a81f8b446f0b077a  # v2026.11.11
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
